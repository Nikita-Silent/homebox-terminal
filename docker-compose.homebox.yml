# Local test Homebox instance for development. Not for production.
# Usage: docker compose -f docker-compose.homebox.yml up -d
services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:0.27.0
    container_name: homebox-terminal-test-homebox
    restart: unless-stopped
    ports:
      - "127.0.0.1:7745:7745"
    # Secrets (HBOX_AUTH_API_KEY_PEPPER) live in .env.homebox, see .env.homebox.example
    env_file: .env.homebox
    environment:
      HBOX_LOG_LEVEL: info
      HBOX_LOG_FORMAT: text
      HBOX_OPTIONS_ALLOW_REGISTRATION: "true"
      HBOX_OPTIONS_ALLOW_ANALYTICS: "false"
    volumes:
      - ./.data/homebox:/data:Z
