# Disposable Homebox for the end-to-end tests (pnpm test:e2e). No volume: every run starts empty.
services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:0.26.2
    ports:
      - "127.0.0.1:7746:7745"
    environment:
      # Test-only value; this instance never holds real data.
      HBOX_AUTH_API_KEY_PEPPER: e2e-only-pepper-0123456789abcdef0123456789
      HBOX_OPTIONS_ALLOW_REGISTRATION: "true"
      HBOX_OPTIONS_ALLOW_ANALYTICS: "false"
      HBOX_LOG_LEVEL: warn
